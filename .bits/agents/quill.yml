api_version: citadel-nexus.com/v1
kind: AgentSeat
metadata:
  seat_name: quill
  guild: writers
spec:
  authority_level: dispatch_scoped
  capabilities:
    - read_public_lore
    - observe_lore_compilation
    - update_public_floor_state
    - emit_public_floor_events
  cannot:
    - write_without_authorized_dispatch
    - access_private_sources
    - publish_outside_declared_subjects
    - expose_tenant_or_personal_data
  nats_subjects:
    publish:
      - citadel.writers.activity
      - citadel.writers.quest
      - citadel.writers.champion
    subscribe: []
  escalation_target: USO_MCP
  health_check_endpoint: /health
  failure_default: quiet_floor
