version: 1
default_authority: deny
fail_closed: true
authorization:
  dispatch_required: true
  accepted_dispatch_statuses:
    - ready
    - in_progress
  require_srs_registry_match: true
  require_branch_match: true
  autonomous_writes: denied
public_safety:
  allow:
    - aggregate_activity
    - public_quest_state
    - champion_state
  deny:
    - credentials
    - private_paths
    - tenant_material
    - personally_identifiable_information
escalation:
  target: USO_MCP
  on:
    - missing_dispatch
    - unauthorized_subject
    - private_data_risk
    - unavailable_required_source
execution:
  missing_source: quiet_floor
  invalid_input: reject_event
  telemetry_failure: continue_without_telemetry
  nats_failure: retain_local_public_state
roster:
  - .bits/agents/quill.yml
