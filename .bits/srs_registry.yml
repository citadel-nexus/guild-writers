# Living-World SRS registry

SRS-CN-WRITERS-LIVINGWORLD-001:
  ep: LIVING-WORLD-SYSTEMS-001
  status: planned
  phase: "Writers floor — public living-world contract"
  paths:
    - src/routes/realm.ts
    - src/automation/livingworld-emitter.ts
  notes: >
    Public contract for the writers floor of the Aincrad living world — the
    citadel.writers.* events + /realm/writers.json feed the game reads. Public-safe only.

SRS-CN-WRITERS-AUTOMATION-001:
  ep: GUILD-AUTOMATION-001
  status: in_progress
  phase: "Writers guild — CI visibility, catalog, PostHog, and build/review automation"
  paths:
    - service.datadog.yaml
    - .env.example
    - .github/workflows/ci.yml
    - .github/CODEOWNERS
  notes: >
    Enable Datadog CI Visibility, fix service catalog entry, document PostHog
    environment variables, and add CODEOWNERS for PR review automation.

SRS-CN-WRITERS-GOVERNANCE-001:
  status: in_progress
  phase: "Writers Guild ownership governance and signed build provenance"
  dispatch: DISP-GOVERNANCE-writers
  cks_gate: "B+/75"
  caps_minimum: pending
  paths:
    - .github/CODEOWNERS
    - GOVERNANCE.md
    - .github/workflows/provenance.yml
    - .bits/srs_registry.yml
    - .bits/srs/SRS-CN-WRITERS-GOVERNANCE-001.md
    - .bits/queue/DISP-GOVERNANCE-writers.md
    - .bits/out/DISP-GOVERNANCE-writers/
  notes: >
    Operator-authorized staging governance bootstrap. Establish ownership,
    approval and escalation rules, document default-branch protections, and
    produce verifiable signed SLSA build provenance without deployment or
    changing GitHub settings. Existing SRS entries remain unchanged.

SRS-CN-WRITERS-BUILD-001:
  status: in_progress
  phase: "Writers Guild reproducible build and CI repair"
  dispatch: DISP-BUILD-writers
  cks_gate: "B+/75"
  caps_minimum: pending
  paths:
    - package.json
    - package-lock.json
    - .nvmrc
    - tsconfig*.json
    - eslint.config.*
    - src/
    - test/
    - .github/workflows/
    - docker/Dockerfile
    - .github/BUILD.md
    - .bits/srs/SRS-CN-WRITERS-BUILD-001.md
    - .bits/queue/DISP-BUILD-writers.md
    - .bits/out/DISP-BUILD-writers/
  notes: >
    Operator-authorized staging build repair, separate from merged governance
    PR 20. Preserve tests and security scanning; no production, deployment,
    secrets or GitHub settings changes.
