name: CI — guild-writers
env:
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: us5.datadoghq.com
  DD_SERVICE: guild-mcp-quill
  DD_ENV: ci
  DD_GIT_REPOSITORY_URL: https://github.com/${{ github.repository }}
  DD_GIT_COMMIT_SHA: ${{ github.sha }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package:provenance
      - name: Upload compiled service
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writers-build
          path: artifacts/writers-build.tar.gz
          if-no-files-found: error
  provenance:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: writers-build
          path: artifacts
      - name: Require a real archive
        run: |
          test -s artifacts/writers-build.tar.gz
          tar -tzf artifacts/writers-build.tar.gz
      - name: Attest compiled service
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: artifacts/writers-build.tar.gz
      - name: Verify provenance and rejection cases
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: bash .github/scripts/verify-provenance.sh artifacts/writers-build.tar.gz "$BUNDLE_PATH"
      - name: Retain signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writers-provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
  docker:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/citadel-nexus/guild-writers:latest
